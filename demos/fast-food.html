<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Comptoir Smash · burgers (démo)</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Archivo:wght@400..800&display=swap">
<!--
  DESIGN FAST-FOOD — app de commande. Layout propre : onglets catégories
  collants, cartes produit chunky avec gros prix, et BARRE DE COMMANDE FIXE en
  bas (signature « app fast-food »). Rien de partagé avec les autres stores
  hormis les helpers window.BID.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: hsl(var(--background)); color: hsl(var(--foreground)); font-family: var(--body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, .brand { font-family: var(--heading); letter-spacing: -0.02em; font-weight: 800; }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 22px; }
  svg { width: 20px; height: 20px; }
  ::selection { background: hsl(var(--primary) / .3); }

  /* Header compact et costaud */
  header { position: sticky; top: 0; z-index: 40; background: hsl(var(--background) / .92); backdrop-filter: blur(10px); border-bottom: 2px solid hsl(var(--foreground)); }
  .nav { display: flex; align-items: center; height: 66px; gap: 20px; }
  .brand { font-size: 22px; text-transform: uppercase; }
  .brand .flame { color: hsl(var(--primary)); }
  .nav .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .ib { width: 42px; height: 42px; border-radius: 12px; border: 2px solid hsl(var(--border)); display: grid; place-items: center; transition: background .15s; }
  .ib:hover { background: hsl(var(--secondary)); }

  /* Hero poster */
  .hero { padding: 44px 0 30px; }
  .hero-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 30px; align-items: center; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .tags span { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 6px 12px; border-radius: 999px; background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
  .hero h1 { font-size: clamp(42px, 7vw, 82px); line-height: .92; text-transform: uppercase; }
  .hero h1 .hl { color: hsl(var(--primary)); }
  .hero p { color: hsl(var(--muted-foreground)); font-size: 17px; margin: 20px 0 26px; max-width: 40ch; font-weight: 500; }
  .big-cta { display: inline-flex; align-items: center; gap: 10px; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font-family: var(--heading); font-weight: 800; text-transform: uppercase; font-size: 17px; padding: 16px 28px; border-radius: 14px; box-shadow: 0 14px 30px -12px hsl(var(--primary)/.6); transition: transform .12s; }
  .big-cta:active { transform: translateY(2px); }
  .hero-img { position: relative; }
  .hero-img .frm { aspect-ratio: 4/3.4; border-radius: 22px; overflow: hidden; border: 3px solid hsl(var(--foreground)); box-shadow: 12px 12px 0 hsl(var(--primary)); }
  .hero-img .frm img { width: 100%; height: 100%; object-fit: cover; }

  /* Onglets catégories collants */
  .tabs { position: sticky; top: 66px; z-index: 30; background: hsl(var(--background)); border-top: 2px solid hsl(var(--foreground)); border-bottom: 2px solid hsl(var(--foreground)); }
  .tabs-inner { display: flex; gap: 8px; padding: 12px 0; overflow-x: auto; }
  .tab { flex: 0 0 auto; font-family: var(--heading); font-weight: 700; text-transform: uppercase; font-size: 14px; padding: 10px 18px; border-radius: 10px; border: 2px solid hsl(var(--border)); white-space: nowrap; transition: all .15s; }
  .tab.on { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-color: hsl(var(--primary)); }

  /* Grille cards chunky */
  .menu { padding: 34px 0 140px; }
  .sec-title { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: hsl(var(--muted-foreground)); font-weight: 700; margin: 8px 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .card { background: hsl(var(--card)); border: 2px solid hsl(var(--foreground)); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; transition: transform .16s; }
  .card:hover { transform: translateY(-4px); }
  .card .ph { aspect-ratio: 5/4; overflow: hidden; position: relative; background: hsl(var(--muted)); }
  .card .ph img { width: 100%; height: 100%; object-fit: cover; }
  .card .stk { position: absolute; top: 12px; left: 12px; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font-family: var(--heading); font-weight: 800; text-transform: uppercase; font-size: 11px; padding: 5px 10px; border-radius: 8px; transform: rotate(-4deg); }
  .card .b { padding: 15px 16px 16px; display: flex; flex-direction: column; flex: 1; }
  .card h3 { font-size: 21px; }
  .card .d { color: hsl(var(--muted-foreground)); font-size: 13px; margin: 5px 0 14px; flex: 1; font-weight: 500; }
  .card .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card .pr { font-family: var(--heading); font-weight: 800; font-size: 26px; }
  .add { display: inline-flex; align-items: center; gap: 7px; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font-family: var(--heading); font-weight: 800; text-transform: uppercase; font-size: 13px; padding: 11px 16px; border-radius: 11px; transition: transform .1s; }
  .add:active { transform: scale(.93); }

  /* Barre de commande fixe */
  .orderbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; transform: translateY(130%); transition: transform .3s cubic-bezier(.34,1.3,.64,1); padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .orderbar.show { transform: translateY(0); }
  .orderbar-in { max-width: 620px; margin: 0 auto; background: hsl(var(--foreground)); color: hsl(var(--background)); border-radius: 16px; padding: 12px 14px 12px 20px; display: flex; align-items: center; gap: 14px; box-shadow: 0 18px 40px -12px hsl(var(--foreground)/.5); cursor: pointer; }
  .orderbar-in .cnt { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font-family: var(--heading); font-weight: 800; min-width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; padding: 0 8px; }
  .orderbar-in .lbl { font-family: var(--heading); font-weight: 800; text-transform: uppercase; font-size: 15px; }
  .orderbar-in .tot { margin-left: auto; font-family: var(--heading); font-weight: 800; font-size: 20px; }
  .orderbar-in .go { display: grid; place-items: center; }

  footer { border-top: 2px solid hsl(var(--foreground)); }
  .foot { display: flex; flex-wrap: wrap; gap: 26px 56px; padding: 40px 0; }
  .foot .fb { font-family: var(--heading); font-weight: 800; text-transform: uppercase; font-size: 22px; }
  .foot .fb .flame { color: hsl(var(--primary)); }
  .foot .col h4 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: hsl(var(--muted-foreground)); margin-bottom: 8px; font-weight: 700; }
  .foot .col p { font-size: 14px; }
  .foot-note { border-top: 1px solid hsl(var(--border)); padding: 16px 0; font-size: 12.5px; color: hsl(var(--muted-foreground)); }

  /* Drawer */
  .scrim { position: fixed; inset: 0; background: hsl(var(--foreground) / .45); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 50; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: 400px; max-width: 92vw; background: hsl(var(--background)); border-left: 2px solid hsl(var(--foreground)); z-index: 51; transform: translateX(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; }
  .drawer.open { transform: translateX(0); }
  .dh { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 16px; border-bottom: 2px solid hsl(var(--foreground)); }
  .dh h2 { font-size: 22px; text-transform: uppercase; }
  .ditems { flex: 1; overflow-y: auto; padding: 6px 22px; }
  .empty { color: hsl(var(--muted-foreground)); text-align: center; padding: 60px 20px; font-weight: 600; }
  .li { display: flex; gap: 13px; padding: 16px 0; border-bottom: 1px solid hsl(var(--border)); }
  .li .lt { width: 60px; height: 60px; border-radius: 12px; overflow: hidden; background: hsl(var(--muted)); flex-shrink: 0; }
  .li .lt img { width: 100%; height: 100%; object-fit: cover; }
  .li .lb { flex: 1; }
  .li .ln { font-family: var(--heading); font-weight: 700; font-size: 16px; }
  .li .lp { color: hsl(var(--muted-foreground)); font-size: 13px; font-weight: 600; }
  .qty { display: inline-flex; align-items: center; gap: 12px; margin-top: 8px; }
  .qty button { width: 28px; height: 28px; border-radius: 9px; border: 2px solid hsl(var(--border)); display: grid; place-items: center; font-weight: 800; }
  .qty span { min-width: 16px; text-align: center; font-weight: 800; }
  .rm { color: hsl(var(--muted-foreground)); font-size: 12px; text-decoration: underline; align-self: flex-start; }
  .df { padding: 18px 22px 24px; border-top: 2px solid hsl(var(--foreground)); }
  .tot2 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .tot2 .tv { font-family: var(--heading); font-weight: 800; font-size: 26px; }
  .cta2 { display: block; text-align: center; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font-family: var(--heading); font-weight: 800; text-transform: uppercase; font-size: 16px; padding: 15px; border-radius: 13px; }

  @media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; } .hero-img { max-width: 380px; } .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto; } }
</style>
</head>
<body data-page="store-fastfood">
<div id="app"></div>
<script src="assets/data.js"></script>
<script src="assets/demo.js"></script>
<script>
  const cfg = window.DEMOS["fast-food"];
  BID.applyTheme(cfg, BID.currentMode());
  BID.injectDemoChrome();
  const items = BID.loadCart(cfg.slug);
  let filter = "all";

  document.getElementById("app").innerHTML = `
    <header><div class="wrap nav">
      <a class="brand" href="index.html">Le Comptoir <span class="flame">Smash</span></a>
      <div class="right">
        <button class="ib" id="theme-toggle" aria-label="Clair/sombre">${BID.svg("sun")}</button>
        <button class="ib" id="cart-open" aria-label="Panier">${BID.svg("cart")}</button>
      </div>
    </div></header>

    <section class="hero"><div class="wrap hero-grid">
      <div>
        <div class="tags"><span>Bœuf français</span><span>Smashé minute</span><span>Livraison 25 min</span></div>
        <h1>Smashé à la commande, <span class="hl">jamais avant.</span></h1>
        <p>Patties fines croustillantes, buns briochés maison, frites fraîches coupées du jour.</p>
        <a class="big-cta" href="#menu">Commander ${BID.svg("arrow")}</a>
      </div>
      <div class="hero-img"><div class="frm"><img src="${cfg.hero.image}" alt="Burger" onerror="this.style.display='none'"></div></div>
    </div></section>

    <div class="tabs"><div class="wrap tabs-inner" id="tabs"></div></div>

    <section class="menu"><div class="wrap"><div class="sec-title" id="sectitle">Toute la carte</div><div class="grid" id="grid"></div></div></section>

    <footer><div class="wrap">
      <div class="foot">
        <div style="flex:1 1 260px"><div class="fb">Le Comptoir <span class="flame">Smash</span></div>
          <p style="color:hsl(var(--muted-foreground));max-width:32ch;margin-top:8px">${BID.esc(cfg.footer.blurb)}</p></div>
        <div class="col"><h4>Horaires</h4>${cfg.footer.hours.map((h) => `<p>${BID.esc(h)}</p>`).join("")}</div>
        <div class="col"><h4>Nous trouver</h4>${cfg.footer.address.map((a) => `<p>${BID.esc(a)}</p>`).join("")}<p>${BID.esc(cfg.footer.phone)}</p></div>
      </div>
      <div class="foot-note">© Le Comptoir Smash · démonstration BeInDigital · thème « Smash », catégorie Fast-food</div>
    </div></footer>

    <div class="orderbar" id="orderbar"><div class="orderbar-in" id="orderbar-in">
      <span class="cnt" id="ob-cnt">0</span><span class="lbl">Voir ma commande</span><span class="tot" id="ob-tot">0,00 €</span><span class="go">${BID.svg("arrow")}</span>
    </div></div>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" aria-label="Panier">
      <div class="dh"><h2>Ma commande</h2><button class="ib" id="cart-close" style="width:36px;height:36px" aria-label="Fermer">${BID.svg("close")}</button></div>
      <div class="ditems" id="ditems"></div>
      <div class="df"><div class="tot2"><span style="color:hsl(var(--muted-foreground))">Total</span><span class="tv" id="tot">0,00 €</span></div>
        <a class="cta2" id="checkout" href="checkout.html?t=fast-food">Payer</a></div>
    </aside>`;

  // Onglets
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = cfg.cats.map((c) => `<button class="tab${c.key === "all" ? " on" : ""}" data-cat="${c.key}">${BID.esc(c.label)}</button>`).join("");
  tabsEl.addEventListener("click", (e) => { const t = e.target.closest(".tab"); if (!t) return; filter = t.dataset.cat; tabsEl.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t)); document.getElementById("sectitle").textContent = filter === "all" ? "Toute la carte" : t.textContent; renderGrid(); });

  const grid = document.getElementById("grid");
  function renderGrid() {
    grid.innerHTML = cfg.menu.filter((m) => filter === "all" || m.cat === filter).map((m) => `
      <article class="card"><div class="ph">${m.tag ? `<span class="stk">${BID.esc(m.tag)}</span>` : ""}<img src="${m.img}" alt="${BID.esc(m.name)}" loading="lazy" onerror="this.style.display='none'"></div>
        <div class="b"><h3>${BID.esc(m.name)}</h3><p class="d">${BID.esc(m.desc)}</p>
          <div class="row"><span class="pr">${BID.eur(m.price)}</span><button class="add" data-add="${m.id}">${BID.svg("plus", ' style="width:15px;height:15px"')} Ajouter</button></div></div>
      </article>`).join("");
  }

  const obar = document.getElementById("orderbar"), obCnt = document.getElementById("ob-cnt"), obTot = document.getElementById("ob-tot");
  const ditems = document.getElementById("ditems"), tot = document.getElementById("tot");
  function persist() { BID.saveCart(cfg.slug, items); sync(); }
  function sync() {
    const n = BID.cartCount(items), total = BID.cartTotal(cfg, items);
    obCnt.textContent = n; obTot.textContent = BID.eur(total); tot.textContent = BID.eur(total);
    obar.classList.toggle("show", n > 0);
    const ids = Object.keys(items).filter((id) => items[id] > 0);
    if (!ids.length) ditems.innerHTML = `<div class="empty">Votre commande est vide.<br>Ajoutez un burger.</div>`;
    else ditems.innerHTML = ids.map((id) => { const m = cfg.menu.find((x) => x.id === id); return `
      <div class="li"><div class="lt"><img src="${m.img}" alt="" onerror="this.style.display='none'"></div>
        <div class="lb"><div class="ln">${BID.esc(m.name)}</div><div class="lp">${BID.eur(m.price)}</div>
          <div class="qty"><button data-dec="${id}">–</button><span>${items[id]}</span><button data-inc="${id}">+</button></div></div>
        <button class="rm" data-rm="${id}">retirer</button></div>`; }).join("");
  }
  document.getElementById("app").addEventListener("click", (e) => {
    const add = e.target.closest("[data-add]"), inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]"), rm = e.target.closest("[data-rm]");
    if (add) { items[add.dataset.add] = (items[add.dataset.add] || 0) + 1; persist(); const m = cfg.menu.find((x) => x.id === add.dataset.add); BID.toast(`${m.name} ajouté`); }
    else if (inc) { items[inc.dataset.inc]++; persist(); }
    else if (dec) { items[dec.dataset.dec] = Math.max(0, items[dec.dataset.dec] - 1); if (!items[dec.dataset.dec]) delete items[dec.dataset.dec]; persist(); }
    else if (rm) { delete items[rm.dataset.rm]; persist(); }
  });
  const scrim = document.getElementById("scrim"), drawer = document.getElementById("drawer");
  const open = () => { scrim.classList.add("open"); drawer.classList.add("open"); };
  const close = () => { scrim.classList.remove("open"); drawer.classList.remove("open"); };
  document.getElementById("cart-open").addEventListener("click", open);
  document.getElementById("orderbar-in").addEventListener("click", open);
  document.getElementById("cart-close").addEventListener("click", close);
  scrim.addEventListener("click", close);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  const tt = document.getElementById("theme-toggle");
  const paint = () => { tt.querySelector("svg").outerHTML = BID.svg(BID.currentMode() === "dark" ? "moon" : "sun"); };
  paint(); tt.addEventListener("click", () => { BID.setMode(BID.currentMode() === "dark" ? "light" : "dark"); BID.applyTheme(cfg, BID.currentMode()); paint(); });
  renderGrid(); sync();
</script>
</body>
</html>
