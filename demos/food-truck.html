<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Remorque · food truck (démo)</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,500..900&family=Work+Sans:wght@400..700&family=JetBrains+Mono:wght@500;700&display=swap">
<!--
  DESIGN FOOD-TRUCK — ardoise de rue, kraft, location-first. Layout propre :
  TABLEAU « OÙ NOUS TROUVER CETTE SEMAINE » en héros (la réalité d'un camion),
  menu façon tickets kraft anguleux empilés, prix tamponnés monospace. Rien de
  partagé avec les autres stores hormis les helpers window.BID.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: hsl(var(--background)); color: hsl(var(--foreground)); font-family: var(--body); line-height: 1.5; -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(hsl(var(--muted-foreground)/.05) 1px, transparent 1px); background-size: 22px 22px; }
  h1, h2, h3, .brand { font-family: var(--heading); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: .95; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 22px; }
  svg { width: 20px; height: 20px; }
  ::selection { background: hsl(var(--primary) / .2); }

  header { position: sticky; top: 0; z-index: 40; background: hsl(var(--background)); border-bottom: 3px solid hsl(var(--foreground)); }
  .nav { display: flex; align-items: center; height: 64px; gap: 18px; }
  .brand { font-size: 26px; }
  .brand .flame { color: hsl(var(--primary)); }
  .nav nav { display: flex; gap: 20px; margin-left: 6px; }
  .nav nav a { font-family: var(--heading); font-weight: 600; text-transform: uppercase; font-size: 15px; color: hsl(var(--muted-foreground)); }
  .nav nav a:hover { color: hsl(var(--foreground)); }
  .nav .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .ib { width: 40px; height: 40px; border-radius: 6px; border: 2px solid hsl(var(--foreground)); display: grid; place-items: center; position: relative; }
  .ib:hover { background: hsl(var(--secondary)); }
  .cc { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-radius: 6px; font-size: 11px; font-weight: 800; display: grid; place-items: center; font-family: var(--body); transform: scale(0); transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
  .cc.show { transform: scale(1); }

  /* Héros = tableau des emplacements */
  .hero { padding: 40px 0 24px; }
  .hero h1 { font-size: clamp(40px, 6.5vw, 74px); max-width: 16ch; }
  .hero h1 .u { color: hsl(var(--primary)); }
  .hero .sub { font-size: 17px; color: hsl(var(--muted-foreground)); margin: 16px 0 0; max-width: 46ch; }
  .board { margin-top: 30px; border: 3px solid hsl(var(--foreground)); border-radius: 8px; overflow: hidden; }
  .board-top { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); padding: 12px 20px; display: flex; align-items: center; gap: 10px; font-family: var(--heading); font-weight: 800; text-transform: uppercase; font-size: 17px; }
  .board-top .live { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; letter-spacing: .06em; }
  .board-top .dot { width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--primary-foreground)); box-shadow: 0 0 0 0 hsl(var(--primary-foreground)/.6); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 hsl(var(--primary-foreground)/.5); } 70% { box-shadow: 0 0 0 8px hsl(var(--primary-foreground)/0); } 100% { box-shadow: 0 0 0 0 hsl(var(--primary-foreground)/0); } }
  .days { display: grid; grid-template-columns: repeat(5, 1fr); background: hsl(var(--card)); }
  .day { padding: 16px 16px 18px; border-right: 2px dashed hsl(var(--border)); }
  .day:last-child { border-right: none; }
  .day.today { background: hsl(var(--accent)); }
  .day .dn { font-family: var(--heading); font-weight: 700; text-transform: uppercase; font-size: 15px; color: hsl(var(--primary)); }
  .day .today-tag { font-family: var(--body); font-size: 10px; font-weight: 800; letter-spacing: .1em; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
  .day .spot { font-weight: 700; font-size: 15px; margin-top: 8px; }
  .day .hrs { font-size: 12.5px; color: hsl(var(--muted-foreground)); margin-top: 2px; }

  /* Menu = ardoise / tickets empilés */
  .menu { padding: 40px 0 130px; }
  .mh { display: flex; align-items: baseline; gap: 14px; border-bottom: 3px solid hsl(var(--foreground)); padding-bottom: 12px; margin-bottom: 6px; }
  .mh h2 { font-size: clamp(28px, 4vw, 42px); }
  .mh .sub { margin-left: auto; font-size: 13px; color: hsl(var(--muted-foreground)); text-transform: uppercase; letter-spacing: .08em; }
  .catgrp { margin-top: 26px; }
  .catgrp > .cl { font-family: var(--heading); font-weight: 700; text-transform: uppercase; font-size: 18px; color: hsl(var(--primary)); margin-bottom: 12px; }
  .ticket { display: grid; grid-template-columns: 74px 1fr auto auto; align-items: center; gap: 16px; background: hsl(var(--card)); border: 2px solid hsl(var(--foreground)); border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; position: relative; }
  .ticket .th { width: 74px; height: 74px; border-radius: 4px; overflow: hidden; background: hsl(var(--muted)); border: 1px solid hsl(var(--border)); }
  .ticket .th img { width: 100%; height: 100%; object-fit: cover; }
  .ticket .tn { font-family: var(--heading); font-weight: 700; text-transform: uppercase; font-size: 21px; }
  .ticket .td { font-size: 13px; color: hsl(var(--muted-foreground)); margin-top: 2px; }
  .ticket .tg { display: inline-block; font-family: var(--body); font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: hsl(var(--primary-foreground)); background: hsl(var(--primary)); padding: 2px 7px; border-radius: 4px; margin-left: 8px; vertical-align: 2px; }
  .ticket .tp { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 19px; border: 2px dashed hsl(var(--border)); padding: 6px 10px; border-radius: 4px; }
  .ticket .ta { width: 44px; height: 44px; border-radius: 6px; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); display: grid; place-items: center; transition: transform .1s; }
  .ticket .ta:active { transform: scale(.9); }

  footer { border-top: 3px solid hsl(var(--foreground)); }
  .foot { display: flex; flex-wrap: wrap; gap: 24px 52px; padding: 34px 0; }
  .foot .fb { font-family: var(--heading); font-weight: 800; text-transform: uppercase; font-size: 24px; }
  .foot .fb .flame { color: hsl(var(--primary)); }
  .foot .col h4 { font-family: var(--heading); font-weight: 700; text-transform: uppercase; font-size: 13px; color: hsl(var(--muted-foreground)); margin-bottom: 6px; }
  .foot .col p { font-size: 14px; }
  .foot-note { border-top: 2px dashed hsl(var(--border)); padding: 16px 0; font-size: 12.5px; color: hsl(var(--muted-foreground)); }

  /* Panier fixe bulle */
  .cartbtn { position: fixed; right: 20px; bottom: 20px; z-index: 45; background: hsl(var(--foreground)); color: hsl(var(--background)); border-radius: 8px; padding: 14px 18px; display: none; align-items: center; gap: 12px; box-shadow: 0 16px 34px -12px hsl(var(--foreground)/.5); font-family: var(--heading); font-weight: 800; text-transform: uppercase; }
  .cartbtn.show { display: inline-flex; }
  .cartbtn .cnt { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-radius: 5px; padding: 2px 8px; }

  .scrim { position: fixed; inset: 0; background: hsl(var(--foreground) / .45); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 50; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: 400px; max-width: 92vw; background: hsl(var(--background)); border-left: 3px solid hsl(var(--foreground)); z-index: 51; transform: translateX(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; }
  .drawer.open { transform: translateX(0); }
  .dh { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px; border-bottom: 3px solid hsl(var(--foreground)); }
  .dh h2 { font-size: 22px; }
  .ditems { flex: 1; overflow-y: auto; padding: 6px 20px; }
  .empty { color: hsl(var(--muted-foreground)); text-align: center; padding: 56px 20px; }
  .li { display: flex; gap: 12px; padding: 14px 0; border-bottom: 2px dashed hsl(var(--border)); }
  .li .lt { width: 54px; height: 54px; border-radius: 4px; overflow: hidden; background: hsl(var(--muted)); flex-shrink: 0; }
  .li .lt img { width: 100%; height: 100%; object-fit: cover; }
  .li .lb { flex: 1; }
  .li .ln { font-family: var(--heading); font-weight: 700; text-transform: uppercase; font-size: 15px; }
  .li .lp { font-family: 'JetBrains Mono', monospace; color: hsl(var(--muted-foreground)); font-size: 12.5px; }
  .qty { display: inline-flex; align-items: center; gap: 12px; margin-top: 7px; }
  .qty button { width: 26px; height: 26px; border-radius: 5px; border: 2px solid hsl(var(--border)); display: grid; place-items: center; font-weight: 800; }
  .qty span { min-width: 14px; text-align: center; font-weight: 800; }
  .rm { color: hsl(var(--muted-foreground)); font-size: 12px; text-decoration: underline; align-self: flex-start; }
  .df { padding: 16px 20px 22px; border-top: 3px solid hsl(var(--foreground)); }
  .tot2 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .tot2 .tv { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; }
  .cta2 { display: block; text-align: center; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font-family: var(--heading); font-weight: 800; text-transform: uppercase; font-size: 16px; padding: 14px; border-radius: 7px; }

  @media (max-width: 860px) { .days { grid-template-columns: repeat(2, 1fr); } .day { border-bottom: 2px dashed hsl(var(--border)); } .nav nav { display: none; } }
  @media (max-width: 560px) { .ticket { grid-template-columns: 60px 1fr; grid-auto-rows: auto; } .ticket .th { width: 60px; height: 60px; } .ticket .tp, .ticket .ta { grid-column: 2; justify-self: start; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto; } }
</style>
</head>
<body data-page="store-foodtruck">
<div id="app"></div>
<script src="assets/data.js"></script>
<script src="assets/demo.js"></script>
<script>
  const cfg = window.DEMOS["food-truck"];
  BID.applyTheme(cfg, BID.currentMode());
  BID.injectDemoChrome();
  const items = BID.loadCart(cfg.slug);

  const schedule = [
    { d: "Lun", spot: "Marché Bastille", h: "11 h 30 - 14 h", today: true },
    { d: "Mar", spot: "Gare du Sud", h: "18 h - 22 h" },
    { d: "Mer", spot: "Place Voltaire", h: "11 h 30 - 14 h" },
    { d: "Jeu", spot: "Quai de Seine", h: "18 h - 22 h" },
    { d: "Ven", spot: "Parc de la Villette", h: "18 h - 23 h" },
  ];
  const catName = { signatures: "Les signatures", veggie: "Veggie", sides: "À côté" };

  const groups = cfg.cats.filter((c) => c.key !== "all").map((c) => {
    const dishes = cfg.menu.filter((m) => m.cat === c.key);
    if (!dishes.length) return "";
    return `<div class="catgrp"><div class="cl">${catName[c.key] || c.label}</div>${dishes.map((m) => `
      <div class="ticket">
        <div class="th"><img src="${m.img}" alt="${BID.esc(m.name)}" loading="lazy" onerror="this.style.display='none'"></div>
        <div><div class="tn">${BID.esc(m.name)}${m.tag ? `<span class="tg">${BID.esc(m.tag)}</span>` : ""}</div><div class="td">${BID.esc(m.desc)}</div></div>
        <div class="tp">${BID.eur(m.price)}</div>
        <button class="ta" data-add="${m.id}" aria-label="Ajouter">${BID.svg("plus")}</button>
      </div>`).join("")}</div>`;
  }).join("");

  document.getElementById("app").innerHTML = `
    <header><div class="wrap nav">
      <a class="brand" href="index.html">La <span class="flame">Remorque</span></a>
      <nav><a href="#carte">La carte</a><a href="#board">Emplacements</a><a href="#">L'équipe</a></nav>
      <div class="right">
        <button class="ib" id="theme-toggle" aria-label="Clair/sombre">${BID.svg("sun")}</button>
        <button class="ib" id="cart-open" aria-label="Panier">${BID.svg("cart")}<span class="cc" id="cc">0</span></button>
      </div>
    </div></header>

    <section class="hero" id="board"><div class="wrap">
      <h1>Cuisine de rue, <span class="u">faite dans le camion.</span></h1>
      <p class="sub">Carte courte, produits du coin. On bouge chaque jour : commandez et récupérez au guichet.</p>
      <div class="board">
        <div class="board-top">${BID.svg("pin", ' style="width:18px;height:18px"')} Où nous trouver cette semaine <span class="live"><span class="dot"></span> Ouvert maintenant</span></div>
        <div class="days">${schedule.map((s) => `<div class="day${s.today ? " today" : ""}"><div class="dn">${s.d}${s.today ? '<span class="today-tag">AUJ.</span>' : ""}</div><div class="spot">${s.spot}</div><div class="hrs">${s.h}</div></div>`).join("")}</div>
      </div>
    </div></section>

    <section class="menu" id="carte"><div class="wrap">
      <div class="mh"><h2>L'ardoise du jour</h2><span class="sub">Commande · retrait guichet</span></div>
      ${groups}
    </div></section>

    <footer><div class="wrap">
      <div class="foot">
        <div style="flex:1 1 240px"><div class="fb">La <span class="flame">Remorque</span></div>
          <p style="color:hsl(var(--muted-foreground));max-width:32ch;margin-top:8px">${BID.esc(cfg.footer.blurb)}</p></div>
        <div class="col"><h4>Rythme</h4>${cfg.footer.address.map((a) => `<p>${BID.esc(a)}</p>`).join("")}</div>
        <div class="col"><h4>Contact</h4><p>${BID.esc(cfg.footer.phone)}</p></div>
      </div>
      <div class="foot-note">© La Remorque · démonstration BeInDigital · thème « Convoi », catégorie Food truck</div>
    </div></footer>

    <button class="cartbtn" id="cartbtn"><span class="cnt" id="cb-cnt">0</span> Ma commande · <span class="mono" id="cb-tot">0,00 €</span></button>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" aria-label="Panier">
      <div class="dh"><h2>À retirer au guichet</h2><button class="ib" id="cart-close" style="width:34px;height:34px" aria-label="Fermer">${BID.svg("close")}</button></div>
      <div class="ditems" id="ditems"></div>
      <div class="df"><div class="tot2"><span style="color:hsl(var(--muted-foreground))">Total</span><span class="tv" id="tot">0,00 €</span></div>
        <a class="cta2" id="checkout" href="checkout.html?t=food-truck">Commander</a></div>
    </aside>`;

  const cc = document.getElementById("cc"), cb = document.getElementById("cartbtn"), cbc = document.getElementById("cb-cnt"), cbt = document.getElementById("cb-tot");
  const ditems = document.getElementById("ditems"), tot = document.getElementById("tot");
  function persist() { BID.saveCart(cfg.slug, items); sync(); }
  function sync() {
    const n = BID.cartCount(items), total = BID.cartTotal(cfg, items);
    cc.textContent = n; cc.classList.toggle("show", n > 0);
    cbc.textContent = n; cbt.textContent = BID.eur(total); cb.classList.toggle("show", n > 0);
    tot.textContent = BID.eur(total);
    const ids = Object.keys(items).filter((id) => items[id] > 0);
    if (!ids.length) ditems.innerHTML = `<div class="empty">Rien pour l'instant.<br>Choisissez sur l'ardoise.</div>`;
    else ditems.innerHTML = ids.map((id) => { const m = cfg.menu.find((x) => x.id === id); return `
      <div class="li"><div class="lt"><img src="${m.img}" alt="" onerror="this.style.display='none'"></div>
        <div class="lb"><div class="ln">${BID.esc(m.name)}</div><div class="lp">${BID.eur(m.price)}</div>
          <div class="qty"><button data-dec="${id}">–</button><span>${items[id]}</span><button data-inc="${id}">+</button></div></div>
        <button class="rm" data-rm="${id}">retirer</button></div>`; }).join("");
  }
  document.getElementById("app").addEventListener("click", (e) => {
    const add = e.target.closest("[data-add]"), inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]"), rm = e.target.closest("[data-rm]");
    if (add) { items[add.dataset.add] = (items[add.dataset.add] || 0) + 1; persist(); const m = cfg.menu.find((x) => x.id === add.dataset.add); BID.toast(`${m.name} ajouté`); }
    else if (inc) { items[inc.dataset.inc]++; persist(); }
    else if (dec) { items[dec.dataset.dec] = Math.max(0, items[dec.dataset.dec] - 1); if (!items[dec.dataset.dec]) delete items[dec.dataset.dec]; persist(); }
    else if (rm) { delete items[rm.dataset.rm]; persist(); }
  });
  const scrim = document.getElementById("scrim"), drawer = document.getElementById("drawer");
  const open = () => { scrim.classList.add("open"); drawer.classList.add("open"); };
  const close = () => { scrim.classList.remove("open"); drawer.classList.remove("open"); };
  document.getElementById("cart-open").addEventListener("click", open);
  document.getElementById("cartbtn").addEventListener("click", open);
  document.getElementById("cart-close").addEventListener("click", close);
  scrim.addEventListener("click", close);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  const tt = document.getElementById("theme-toggle");
  const paint = () => { tt.querySelector("svg").outerHTML = BID.svg(BID.currentMode() === "dark" ? "moon" : "sun"); };
  paint(); tt.addEventListener("click", () => { BID.setMode(BID.currentMode() === "dark" ? "light" : "dark"); BID.applyTheme(cfg, BID.currentMode()); paint(); });
  sync();
</script>
</body>
</html>
