name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Lint + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: "Guard — pas d'overrides link: commités"
        run: |
          if grep -q '"link:' package.json; then
            echo "::error::package.json contient des overrides link: (mode engine-link). Lancer pnpm engine:unlink avant de commiter."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        # --frozen-lockfile as soon as the lockfile is committed; otherwise a
        # plain install (first template commit, before the first tokened install)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          CONVEX_SITE_URL: https://placeholder.convex.site

  detect-mobile:
    name: Detect mobile app
    runs-on: ubuntu-latest
    outputs:
      has_mobile: ${{ steps.check.outputs.has_mobile }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f mobile/package.json ]; then
            echo "has_mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_mobile=false" >> "$GITHUB_OUTPUT"
          fi

  mobile:
    name: Lint + Typecheck (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-mobile
    if: needs.detect-mobile.outputs.has_mobile == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The mobile app is self-contained (no private packages): no token needed
      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install

      - name: Lint mobile
        working-directory: mobile
        run: pnpm lint

      - name: Typecheck mobile
        working-directory: mobile
        run: pnpm typecheck

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web
    # Enable by setting the repo variable CONVEX_E2E_ENABLED=true
    # plus the E2E_* secrets (dedicated test Convex deployment)
    if: vars.CONVEX_E2E_ENABLED == 'true'
    env:
      # No `|| 'https://placeholder.convex.cloud'` fallback.
      #
      # playwright.config.ts builds the `setup` and `admin` projects out of a
      # spread — `...(hasRealBackend ? [project] : [])` — and a URL containing
      # "placeholder" makes that false. The projects are then not skipped, they
      # are never declared: 43 of 56 spec files disappear from the run and from
      # the report, and Playwright exits 0 over the handful that remain. The
      # fallback turned "nobody configured a backend" into a green tick.
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.E2E_NEXT_PUBLIC_CONVEX_URL }}
      CONVEX_SITE_URL: ${{ secrets.E2E_CONVEX_SITE_URL }}
      BETTER_AUTH_URL: http://localhost:3000
      SITE_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${{ secrets.E2E_BETTER_AUTH_SECRET }}

    steps:
      # Before anything is installed or built: if this job is running at all,
      # the flag says E2E is wanted, and E2E without a backend cannot happen.
      - name: Require a backend to test against
        run: |
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "::error::CONVEX_E2E_ENABLED is true but E2E_NEXT_PUBLIC_CONVEX_URL is unset."
            echo "Playwright cannot run without a deployment to point at."
            echo "Set the E2E_* secrets, or unset CONVEX_E2E_ENABLED to skip E2E honestly."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm test:e2e:install

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          CI: "true"

      - name: Prove the suite actually ran
        # Playwright exits 0 when it has nothing to run. See the comment on
        # NEXT_PUBLIC_CONVEX_URL above for the two ways that happens here.
        if: always()
        run: |
          node scripts/assert-e2e-ran.mjs playwright-report/report.json \
            --min 100 --projects setup,public,admin

      - name: Upload Playwright report
        # always(), not failure(): a run that passed over 13 of 56 spec files
        # leaves no artifact to notice that with.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
