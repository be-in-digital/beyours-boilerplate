name: Sync engine

# Resynchronise le miroir du shell applicatif depuis
# be-in-digital/beindigital-engine (apps/restaurant-theme) et ouvre une PR
# quand il y a une dérive. Voir docs/UPDATES.md et scripts/sync-from-engine.mjs.
#
# Requiert le secret ENGINE_SYNC_TOKEN : PAT fine-grained avec contents:read
# sur beindigital-engine (docs/SETUP-CI.md). Sans lui, le job s'arrête
# proprement avec une notice.

on:
  schedule:
    - cron: "17 6 * * 1-5" # jours ouvrés, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le secret
        id: token
        run: |
          if [ -z "${{ secrets.ENGINE_SYNC_TOKEN }}" ]; then
            echo "::notice::ENGINE_SYNC_TOKEN absent — sync engine sautée (docs/SETUP-CI.md)."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone engine
        if: steps.token.outputs.available == 'true'
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.ENGINE_SYNC_TOKEN }}@github.com/be-in-digital/beindigital-engine" \
            "$RUNNER_TEMP/engine"

      - uses: actions/setup-node@v4
        if: steps.token.outputs.available == 'true'
        with:
          node-version: 22

      - name: Resync
        if: steps.token.outputs.available == 'true'
        run: node scripts/sync-from-engine.mjs --engine "$RUNNER_TEMP/engine"

      - name: Ouvrir une PR si dérive
        if: steps.token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # .engine-sync.json seul = pas de dérive réelle du miroir
          if [ -z "$(git status --porcelain | grep -v '.engine-sync.json' || true)" ]; then
            echo "Aucune dérive — rien à ouvrir."
            exit 0
          fi
          sha=$(node -p "require('./.engine-sync.json').engineCommit.slice(0,7)")
          branch="sync/engine-$sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore(sync): miroir engine @ $sha"
          git push -u origin "$branch" --force
          {
            echo "Resync automatique du shell depuis \`beindigital-engine/apps/restaurant-theme\`."
            echo ""
            echo "Avant merge :"
            echo "- [ ] Lire le rapport de dépendances dans les logs du workflow (section « Dépendances à réconcilier ») et appliquer les ajouts éventuels à \`package.json\`"
            echo "- [ ] Valider en local : \`pnpm engine:link <clone> && pnpm typecheck && pnpm test && pnpm build\`"
            echo "- [ ] Si le schéma Convex a bougé : prévoir \`pnpm convex:deploy\` sur les sites après leur \`update:template\`"
            echo ""
            echo "Généré par \`.github/workflows/sync-engine.yml\`."
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main \
            --title "chore(sync): miroir engine @ $sha" \
            --body-file "$RUNNER_TEMP/pr-body.md" || echo "PR déjà ouverte pour cette branche."
